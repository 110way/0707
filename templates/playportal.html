{% extends "base.html" %}

{% block title %}My Play Portal - {{ app_name }}{% endblock %}

{% block content %}
<style>
  .play-portal-container {
    position: fixed;
    top: 4rem;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    padding-top: 2rem;
    padding-bottom: 1.5rem;
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .portal-header {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid rgba(226, 232, 240, 0.6);
  }

  .dark .portal-header {
    border-color: rgba(51, 65, 85, 0.6);
  }

  .portal-header-info {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .portal-header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
  }

  .portal-outline-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
    padding: 0.625rem 1rem;
    border: 1px solid rgba(203, 213, 225, 0.8);
    color: #334155;
    font-weight: 600;
    font-size: 0.875rem;
    border-radius: 0.75rem;
    transition: all 0.2s;
    text-decoration: none;
    background-color: transparent;
  }

  .portal-outline-btn:hover {
    background-color: rgba(241, 245, 249, 0.8);
    border-color: rgba(148, 163, 184, 0.8);
    transform: translateY(-0.5px);
  }

  .dark .portal-outline-btn {
    border-color: rgba(71, 85, 105, 0.8);
    color: #cbd5e1;
  }

  .dark .portal-outline-btn:hover {
    background-color: rgba(30, 41, 59, 0.8);
    border-color: rgba(100, 116, 139, 0.8);
  }

  @media (min-width: 768px) {
    .play-portal-container {
      left: 16rem;
    }
  }

  @media (min-width: 1024px) {
    .play-portal-container {
      padding-left: 2rem;
      padding-right: 2rem;
      padding-bottom: 2rem;
    }
  }

  @media (min-width: 1280px) {
    .portal-header {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }

    .portal-header-actions {
      flex-wrap: nowrap;
      justify-content: flex-end;
    }
  }
</style>

<div class="play-portal-container bg-slate-50 dark:bg-slate-950" x-data="{
         /* 
          * DEFAULT_URL_CONFIGURATION: 
          * Change the hardcoded default URL below to configure it for your application.
          */
         activeUrl: '',
         isIframeLoading: true,
         showErrorHint: false,
         onLoaded() {
             this.isIframeLoading = false;
             // Show hint banner after 3s in case the embedded app has auth errors
             setTimeout(() => { this.showErrorHint = true; }, 3000);
         }
     }">

  <!-- Page Header -->
  <div class="portal-header flex-shrink-0">
    <div class="portal-header-info text-left">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2.5">
        <i data-lucide="gamepad-2" class="h-7 w-7 text-indigo-500"></i>
        My Play Portal
      </h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">
        Launch and interact with external applications and games inside the portal.
      </p>
    </div>
    <div class="portal-header-actions flex-shrink-0 text-left">
      <!-- Error hint banner -->
      <div x-show="showErrorHint && !isIframeLoading" x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-1" x-transition:enter-end="opacity-100 translate-y-0"
        class="flex items-center gap-2.5 px-3.5 py-2 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/50 rounded-xl text-xs font-semibold text-amber-700 dark:text-amber-400">
        <i data-lucide="alert-triangle" class="h-3.5 w-3.5 flex-shrink-0"></i>
        <span>Seeing errors? This site may block embedding.</span>
        <button @click="showErrorHint = false"
          class="ml-1 opacity-50 hover:opacity-100 text-amber-700 dark:text-amber-400">&times;</button>
      </div>
      <!-- Goto My Play Portal Button -->
      <a :href="activeUrl" target="_blank"
        class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-bold text-sm rounded-xl shadow-md hover:shadow-lg transition-all"
        style="white-space: nowrap;">
        <i data-lucide="external-link" class="h-4.5 w-4.5"></i>
        Goto My Play Portal
      </a>
    </div>
  </div>

  <!-- Carousel Slideshow -->
  <div x-data="playPortalCarousel()" class="relative w-full h-96 md:h-[500px] overflow-hidden rounded-xl bg-slate-800">
    <!-- Images -->
    <template x-for="(img, idx) in images" :key="idx">
      <img :src="img"
        :class="{'opacity-0 absolute inset-0 w-full h-full object-cover transition-opacity duration-700': true, 'opacity-100 relative': idx === current}" />
    </template>
    <!-- Navigation Arrows -->
    <button @click="prev"
      class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/70 hover:bg-white/90 rounded-full p-2 focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-800" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <button @click="next"
      class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/70 hover:bg-white/90 rounded-full p-2 focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-800" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
    <!-- Dots -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2">
      <template x-for="(img, idx) in images" :key="idx">
        <button @click="goTo(idx)"
          :class="{'w-3 h-3 rounded-full': true, 'bg-white': idx === current, 'bg-gray-400': idx !== current}"
          class="focus:outline-none"></button>
      </template>
    </div>
  </div>
  <script>
    function playPortalCarousel() {
      return {
        images: [],
        current: 0,
        interval: null,
        async init() {
          try {
            const response = await fetch('/api/playportal/images');
            const data = await response.json();
            this.images = data.images || [];
            if (this.images.length) {
              this.startAutoplay();
            }
          } catch (e) {
            console.error('Failed to load carousel images', e);
          }
        },
        startAutoplay() {
          this.interval = setInterval(() => this.next(), 5000);
        },
        next() {
          this.current = (this.current + 1) % this.images.length;
        },
        prev() {
          this.current = (this.current - 1 + this.images.length) % this.images.length;
        },
        goTo(idx) {
          this.current = idx;
          clearInterval(this.interval);
          this.startAutoplay();
        }
      };
    }
  </script>

</div>
{% endblock %}
